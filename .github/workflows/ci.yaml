name: CI
on:
  pull_request: ~
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build container image
        run: docker compose build

      - name: Run tests
        run: make pytest

      - name: Run isort
        run: make isort

      - name: Run flake8
        run: make flake8

      - name: Run mypy
        run: make mypy
